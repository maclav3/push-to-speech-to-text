[project]
name = "push-to-speech-to-text"
version = "0.1.0"
description = "Hotkey dictation for Linux. Whisper types into the focused text field."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.0"]

[project.scripts]
push-to-stt = "push_to_stt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
